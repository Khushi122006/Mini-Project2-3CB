<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin — Manage Listings | Bridge</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>
        .admin-shell {
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 28px 100px;
        }

        .admin-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .admin-table-wrap {
            background: var(--paper-raise);
            border: 1px solid var(--line);
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 640px;
        }

        .admin-table th,
        .admin-table td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(23,33,40,0.55);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop.open {
            display: flex;
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="container">

        <a href="index.html"
           class="logo">
            Bridge<span>.</span>
        </a>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="jobs.html">Jobs</a>
                </li>

                <li>
                    <a href="internships.html">
                        Internships
                    </a>
                </li>

                <li>
                    <a href="admin.html"
                       class="active">
                        Admin
                    </a>
                </li>

            </ul>
        </nav>

        <div class="nav-actions">
            <span class="badge badge-gold">
                Admin mode
            </span>
        </div>

    </div>
</header>

<div class="admin-shell">

    <div class="admin-head">

        <div>

            <h1>
                Manage listings
            </h1>

            <p>
                Add, edit, or remove jobs and internships.
                Changes save to this browser and update
                the listing pages automatically.
            </p>

        </div>

        <div>

            <button class="btn btn-outline btn-sm"
                    id="reset-btn"
                    type="button">
                Reset to defaults
            </button>

            <button class="btn btn-primary btn-sm"
                    id="add-btn"
                    type="button">
                + Add listing
            </button>

        </div>

    </div>

    <div class="admin-table-wrap">

        <table class="admin-table">

            <thead>
                <tr>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Posted</th>
                </tr>
            </thead>

            <tbody id="admin-rows">
                <tr>
                    <td colspan="5">
                        Loading…
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<div class="modal-backdrop"
     id="modal-backdrop">

    <div class="modal">

        <h2 id="modal-title">
            Add listing
        </h2>

        <form id="listing-form">

            <input type="hidden"
                   id="f-id">

            <div class="field">

                <label for="f-category">
                    Category
                </label>

                <select id="f-category"
                        required>

                    <option value="job">
                        Job (full-time)
                    </option>

                    <option value="internship">
                        Internship
                    </option>

                </select>

            </div>

            <div class="field-row">

                <div class="field">
                    <label for="f-title">
                        Title
                    </label>

                    <input type="text"
                           id="f-title"
                           required>
                </div>

                <div class="field">
                    <label for="f-company">
                        Company
                    </label>

                    <input type="text"
                           id="f-company"
                           required>
                </div>

            </div>

        </form>

    </div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
