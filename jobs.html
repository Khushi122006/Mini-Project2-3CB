<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Jobs | JobAdda</title>

    <style>

        /* Website colors */
        :root {
            --primary: #5b4cf5;
            --primary-dark: #4338ca;
            --dark: #172033;
            --muted: #6b7788;
            --bg: #f6f7fb;
            --white: #ffffff;
            --line: #e5e8ef;
            --soft: #f0efff;
            --green: #159a67;
            --red: #dc3545;
            --orange: #f59e0b;
            --shadow: 0 18px 45px rgba(31, 41, 55, 0.08);
            --radius: 16px;
        }

        /* Reset default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Body styling */
        body {
            background: var(--bg);
            color: var(--dark);
            font-family: Inter, Arial, sans-serif;
            line-height: 1.6;
        }

        /* Remove link underline */
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Form font */
        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        /* Button cursor */
        button {
            cursor: pointer;
        }

        /* Main container */
        .container {
            width: min(1100px, calc(100% - 36px));
            margin: auto;
        }

        /* Navigation bar */
        .topbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* Navigation layout */
        .nav {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        /* Website logo */
        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* Purple logo text */
        .brand span,
        .eyebrow {
            color: var(--primary);
        }

        /* Navigation links */
        .nav-links {
            display: flex;
            gap: 22px;
            font-size: 14px;
            font-weight: 700;
            color: #596579;
        }

        /* Navigation hover */
        .nav-links a:hover {
            color: var(--primary);
        }

        /* Navigation buttons */
        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Common button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 0;
            border-radius: 10px;
            padding: 10px 15px;
            font-weight: 700;
        }

        /* Primary button */
        .btn-primary {
            background: var(--primary);
            color: white;
        }

        /* Primary button hover */
        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* Soft button */
        .btn-soft {
            background: var(--soft);
            color: var(--primary);
        }

        /* Danger button */
        .btn-danger {
            background: #fff0f1;
            color: var(--red);
        }

        /* Mobile menu */
        .menu {
            display: none;
            border: 0;
            background: #f2f3f7;
            padding: 9px;
            border-radius: 9px;
        }

        /* Hero section */
        .hero {
            min-height: 470px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 45px;
            align-items: center;
            padding: 65px 0;
        }

        /* Small heading */
        .eyebrow {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Hero heading */
        .hero h1 {
            font-size: clamp(42px, 6vw, 68px);
            line-height: 1.03;
            letter-spacing: -3px;
            margin: 13px 0;
        }

        /* Hero highlighted text */
        .hero h1 span {
            color: var(--primary);
        }

        /* Hero paragraph */
        .hero p {
            color: var(--muted);
            font-size: 17px;
            max-width: 570px;
        }

        /* Hero search box */
        .search-box {
            display: flex;
            gap: 8px;
            background: white;
            border: 1px solid var(--line);
            padding: 7px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-top: 25px;
        }

        /* Search input */
        .search-box input {
            flex: 1;
            border: 0;
            outline: 0;
            padding: 11px;
        }

        /* Hero design area */
        .hero-art {
            min-height: 330px;
            border-radius: 24px;
            background: linear-gradient(145deg, #ebe9ff, #fff);
            border: 1px solid #ddd9ff;
            display: grid;
            place-items: center;
        }

        /* Hero card */
        .hero-card {
            background: #fff;
            width: 74%;
            padding: 25px;
            border-radius: 17px;
            box-shadow: var(--shadow);
        }

        /* Hero card title */
        .hero-card strong {
            display: block;
            font-size: 18px;
        }

        /* Hero card small text */
        .hero-card small {
            color: var(--muted);
        }

        /* Statistics section */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-bottom: 55px;
        }

        /* Common card */
        .stat,
        .card {
            background: white;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
        }

        /* Statistic number */
        .stat strong {
            display: block;
            font-size: 27px;
        }

        /* Small muted text */
        .stat span,
        .muted {
            color: var(--muted);
            font-size: 13px;
        }

        /* Section spacing */
        .section {
            padding: 60px 0;
        }

        /* Section heading */
        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 24px;
        }

        /* Section title */
        .section-heading h2 {
            font-size: 30px;
            margin-top: 7px;
        }

        /* Job card grid */
        .job-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px;
        }

        /* Job card */
        .job-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 19px;
            transition: 0.2s;
        }

        /* Job card hover */
        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        /* Job card top */
        .job-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        /* Company logo */
        .logo {
            width: 43px;
            height: 43px;
            border-radius: 11px;
            background: var(--soft);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-weight: 800;
        }

        /* Save button */
        .save {
            border: 0;
            background: #f7f7fa;
            width: 35px;
            height: 35px;
            border-radius: 9px;
            color: #697386;
        }

        /* Saved button */
        .save.active {
            background: var(--soft);
            color: var(--primary);
        }

        /* Job title */
        .job-card h3 {
            margin: 13px 0 3px;
            font-size: 17px;
        }

        /* Company name */
        .company {
            font-size: 13px;
            color: var(--muted);
        }

        /* Job tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 14px 0;
        }

        /* Individual tag */
        .tag {
            background: #f5f6f8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #596579;
        }

        /* Job card bottom */
        .job-bottom {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding-top: 13px;
            border-top: 1px solid var(--line);
            font-size: 12px;
        }

        /* Salary */
        .salary {
            font-weight: 800;
        }

        /* Page heading */
        .page-head {
            padding: 55px 0 25px;
        }

        /* Page title */
        .page-head h1 {
            font-size: 40px;
            letter-spacing: -1px;
        }

        /* Page description */
        .page-head p {
            color: var(--muted);
            margin-top: 5px;
        }

        /* Job filters */
        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* Input and select */
        .input,
        .select,
        .textarea {
            width: 100%;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            padding: 11px;
            outline: none;
        }

        /* Input focus */
        .input:focus,
        .select:focus,
        .textarea:focus {
            border-color: var(--primary);
        }

        /* Job details layout */
        .detail {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        /* Job details heading */
        .detail h2 {
            margin-bottom: 8px;
        }

        /* Job details text */
        .detail p {
            color: var(--muted);
        }

        /* Job details side card */
        .detail-side {
            position: sticky;
            top: 90px;
            height: max-content;
        }

        /* List */
        .list {
            display: grid;
            gap: 10px;
        }

        /* List row */
        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid var(--line);
            padding: 13px 0;
        }

        /* Last row */
        .row:last-child {
            border: 0;
        }

        /* Form container */
        .form-wrap {
            max-width: 480px;
            margin: 55px auto;
        }

        /* Form heading */
        .form-wrap h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        /* Form description */
        .form-wrap > p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        /* Form layout */
        .form {
            display: grid;
            gap: 13px;
        }

        /* Form label */
        .form label {
            font-size: 13px;
            font-weight: 700;
        }

        /* Form group */
        .form-group {
            display: grid;
            gap: 6px;
        }

        /* Success message */
        .notice {
            padding: 12px;
            border-radius: 10px;
            background: #eef9f4;
            color: #16704f;
            font-size: 13px;
        }

        /* Dashboard layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 18px;
        }

        /* Dashboard statistics */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        /* Small statistic */
        .small-stat {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 16px;
        }

        /* Small statistic number */
        .small-stat strong {
            display: block;
            font-size: 23px;
        }

        /* Empty message */
        .empty {
            text-align: center;
            padding: 35px;
            color: var(--muted);
        }

        /* Call to action */
        .cta {
            background: var(--primary);
            color: white;
            border-radius: 20px;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* CTA paragraph */
        .cta p {
            color: #ddd9ff;
            margin-top: 5px;
        }

        /* Footer */
        .footer {
            background: #161c2c;
            color: #aeb7c7;
            padding: 35px 0;
            margin-top: 50px;
        }

        /* Footer columns */
        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 30px;
        }

        /* Footer links */
        .footer a {
            display: block;
            margin: 5px 0;
            font-size: 13px;
        }

        /* Footer headings */
        .footer h4 {
            color: white;
            margin-bottom: 8px;
        }

        /* Footer bottom */
        .footer-bottom {
            border-top: 1px solid #2a3244;
            margin-top: 25px;
            padding-top: 18px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        /* Admin layout */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 18px;
        }

        /* Status label */
        .status {
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 11px;
            background: #fff7df;
            color: #8a6500;
        }

        /* Success text */
        .success {
            color: var(--green);
        }

        /* Tablet design */
        @media (max-width: 850px) {

            .nav-links {
                display: none;
            }

            .menu {
                display: block;
            }

            .hero,
            .detail,
            .dashboard-grid,
            .admin-grid {
                grid-template-columns: 1fr;
            }

            .hero-art {
                min-height: 260px;
            }

            .job-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr 1fr;
            }

            .detail-side {
                position: static;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Mobile design */
        @media (max-width: 560px) {

            .container {
                width: min(100% - 24px, 1100px);
            }

            .hero {
                padding: 45px 0;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .job-grid,
            .stats,
            .stat-grid,
            .filters {
                grid-template-columns: 1fr;
            }

            .nav-actions .btn {
                display: none;
            }

            .section-heading {
                align-items: start;
                flex-direction: column;
            }

            .cta {
                align-items: start;
                flex-direction: column;
            }

            .footer-grid {
                grid-template-columns: 1fr;
            }

            .footer-bottom {
                flex-direction: column;
                gap: 5px;
            }
        }

    </style>

</head>


<body>

    <!-- Navigation bar -->
    <header class="topbar">

        <div class="container nav">

            <!-- Website logo -->
            <a class="brand" href="index.html">
                Job<span>Adda</span>
            </a>

            <!-- Navigation links -->
            <nav class="nav-links">

                <a href="jobs.html">Jobs</a>
                <a href="internships.html">Internships</a>
                <a href="saved.html">Saved</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="about.html">About</a>

            </nav>

            <!-- User navigation -->
            <div class="nav-actions" data-user-nav></div>

        </div>

    </header>


    <!-- Main content -->
    <main class="container">

        <!-- Page heading -->
        <div class="page-head">

            <span class="eyebrow">
                Explore
            </span>

            <h1>
                Find jobs & internships
            </h1>

            <p>
                Use simple filters to find an opportunity that matches your skills.
            </p>

        </div>


        <!-- Search and filters -->
        <div class="filters">

            <!-- Search input -->
            <input
                class="input"
                id="keyword"
                placeholder="Search by title, company or skill"
            >

            <!-- Location filter -->
            <select class="select" id="location">

                <option value="">
                    All locations
                </option>

                <option>Bengaluru</option>
                <option>Mumbai</option>
                <option>Pune</option>
                <option>Hyderabad</option>
                <option>Delhi</option>
                <option>Gurugram</option>

            </select>

            <!-- Job type filter -->
            <select class="select" id="type">

                <option value="">
                    All types
                </option>

                <option>Internship</option>
                <option>Full-time</option>

            </select>

            <!-- Work mode filter -->
            <select class="select" id="mode">

                <option value="">
                    All modes
                </option>

                <option>Remote</option>
                <option>Hybrid</option>
                <option>On-site</option>

            </select>

        </div>


        <!-- Jobs will be added here by JavaScript -->
        <div class="job-grid" data-jobs></div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-bottom">

            <span>
                JobAdda
            </span>

            <span>
                Simple student career portal
            </span>

        </div>

    </footer>


    <!-- JavaScript file -->
    <script src="js/app.js"></script>

</body>

</html>
