<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs — Bridge</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">
    <div class="container">
        <a href="index.html" class="logo">Bridge<span>.</span></a>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html" class="active">Jobs</a></li>
                <li><a href="internships.html">Internships</a></li>
                <li><a href="about.html">For Employers</a></li>
                <li><a href="about.html#contact">Contact</a></li>
            </ul>
        </nav>

        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline btn-sm">Log in</a>
            <a href="register.html" class="btn btn-primary btn-sm">Get started</a>
        </div>
    </div>
</header>

<div class="page-header">
    <div class="container">
        <h1>Full-time &amp; part-time roles</h1>
        <p>
            Open positions from companies actively hiring
            students and recent graduates.
        </p>
    </div>
</div>

<section class="section">
    <div class="container listing-page">

        <aside class="filters">
            <h4>Filter roles</h4>

            <form>
                <label for="fq">Keyword</label>
                <input type="text"
                       id="fq"
                       placeholder="Job title or skill">

                <h4>Job type</h4>

                <label>
                    <input type="checkbox" checked>
                    Full-time
                </label>

                <label>
                    <input type="checkbox">
                    Part-time
                </label>

                <label>
                    <input type="checkbox">
                    Contract
                </label>

                <button type="submit"
                        class="btn btn-primary btn-block">
                    Apply filters
                </button>
            </form>
        </aside>

    </div>
</section>

</body>
</html>
