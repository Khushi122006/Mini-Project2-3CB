<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JobAdda student placement and opportunity portal">

    <title>Opportunity Details | JobAdda</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');

        :root {
            --primary: #5b4cf5;
            --primary-dark: #4638d8;
            --ink: #172033;
            --muted: #6b7788;
            --bg: #f6f7fb;
            --white: #fff;
            --line: #e7e9f0;
            --soft: #efedff;
            --green: #16845d;
            --red: #d9485f;
            --shadow: 0 14px 38px rgba(28,35,62,.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'DM Sans', Arial, sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: min(1160px, calc(100% - 40px));
            margin: auto;
        }

        /* Navigation */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            font: 800 27px 'Manrope', sans-serif;
            letter-spacing: -1.2px;
            color: var(--ink);
            white-space: nowrap;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            color: #566176;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-toggle {
            display: none;
            border: 1px solid var(--line);
            background: white;
            border-radius: 10px;
            padding: 9px 12px;
        }

        /* Buttons */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid transparent;
            border-radius: 11px;
            padding: 11px 17px;
            font-weight: 700;
            font-size: 14px;
            transition: .2s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 7px 16px #5b4cf52b;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: #fff;
            border-color: var(--line);
            color: var(--ink);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-soft {
            background: var(--soft);
            color: var(--primary);
        }

        .btn-danger {
            background: #fff0f2;
            color: var(--red);
        }

        .btn-block {
            width: 100%;
        }

        /* Headings */

        .eyebrow {
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .hero {
            padding: 76px 0 56px;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            align-items: center;
            gap: 55px;
        }

        .hero h1 {
            font: 800 clamp(42px,6vw,66px)/1.08 'Manrope', sans-serif;
            letter-spacing: -2.8px;
            margin: 14px 0 18px;
        }

        .gradient-text {
            color: var(--primary);
        }

        .lead {
            font-size: 18px;
            color: var(--muted);
            max-width: 610px;
        }

        /* Cards */

        .feature-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .company-mark {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--soft);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 18px;
        }

        .muted {
            color: var(--muted);
        }

        .tag {
            display: inline-flex;
            background: #f1f2f8;
            color: #596579;
            border-radius: 30px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            margin: 5px 5px 0 0;
        }

        .tag.purple {
            background: var(--soft);
            color: var(--primary);
        }

        .section {
            padding: 45px 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 22px;
        }

        .section-head h2 {
            font: 800 29px 'Manrope', sans-serif;
            margin: 5px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 16px;
            margin: 22px 0 10px;
        }

        .stat {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px;
        }

        .stat strong {
            display: block;
            font: 800 28px 'Manrope';
            color: var(--primary);
        }

        .stat span {
            font-size: 13px;
            color: var(--muted);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 18px;
        }

        .job-card,
        .panel,
        .auth-card,
        .info-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 5px 20px rgba(25,32,55,.035);
        }

        .job-card {
            padding: 21px;
            display: flex;
            flex-direction: column;
            min-height: 245px;
        }

        .job-card h3 {
            margin: 13px 0 4px;
            font-size: 18px;
        }

        .job-card .company {
            color: var(--muted);
            font-size: 14px;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: var(--muted);
            font-size: 13px;
            margin: 13px 0;
        }

        .job-card .card-bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        /* Page heading */

        .page-heading {
            padding: 48px 0 25px;
        }

        .page-heading h1 {
            font: 800 39px 'Manrope';
            margin: 6px 0;
        }

        .page-heading p {
            color: var(--muted);
            margin: 0;
        }

        /* Forms */

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            background: white;
            border: 1px solid var(--line);
            padding: 14px;
            border-radius: 15px;
            margin: 15px 0 24px;
        }

        .control {
            width: 100%;
            border: 1px solid #dfe2eb;
            background: #fff;
            border-radius: 10px;
            padding: 12px 13px;
            outline: none;
        }

        .control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px #5b4cf51a;
        }

        .auth-wrap {
            min-height: calc(100vh - 150px);
            display: grid;
            place-items: center;
            padding: 45px 16px;
        }

        .auth-card {
            width: min(100%,510px);
            padding: 35px;
        }

        .auth-card h1 {
            text-align: center;
            font: 800 31px 'Manrope';
            margin: 0 0 7px;
        }

        .auth-sub {
            text-align: center;
            color: var(--muted);
            margin: 0 0 27px;
        }

        .field {
            margin: 0 0 17px;
        }

        .field label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dfe2eb;
            border-radius: 10px;
            outline: 0;
            background: white;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px #5b4cf51a;
        }

        .role-row {
            display: flex;
            gap: 22px;
            padding: 13px;
            background: #f8f8fc;
            border-radius: 11px;
            margin-bottom: 20px;
        }

        .role-row label {
            display: flex;
            gap: 8px;
            align-items: center;
            font-weight: 600;
        }

        .role-row input {
            accent-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
        }

        .auth-foot {
            text-align: center;
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .auth-foot a {
            color: var(--primary);
            font-weight: 700;
        }

        .notice {
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 13px;
            margin: 13px 0;
            display: none;
        }

        .notice.show {
            display: block;
        }

        .notice.error {
            background: #fff0f2;
            color: #b4233d;
        }

        .notice.success {
            background: #eaf8f1;
            color: #16734f;
        }

        .inline-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            margin: 4px 0 18px;
        }

        .inline-between a {
            color: var(--primary);
            font-weight: 700;
        }

        /* Job details */

        .detail-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 22px;
            padding: 25px 0 60px;
        }

        .panel {
            padding: 25px;
        }

        .panel h2 {
            margin: 0 0 12px;
            font: 800 21px 'Manrope';
        }

        .detail-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .detail-title h1 {
            font: 800 30px 'Manrope';
            margin: 0;
        }

        .description-text {
            color: #536078;
            white-space: pre-line;
        }

        /* Empty state */

        .empty-state {
            text-align: center;
            padding: 55px 20px;
            background: white;
            border: 1px dashed #cfd2df;
            border-radius: 18px;
        }

        .empty-state .empty-icon {
            font-size: 38px;
        }

        .empty-state h3 {
            margin: 10px 0 4px;
        }

        /* Dashboard */

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 16px;
        }

        .dashboard-tile {
            padding: 22px;
            background: white;
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .dashboard-tile strong {
            font: 800 28px 'Manrope';
            display: block;
            color: var(--primary);
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start;
        }

        .admin-list {
            display: grid;
            gap: 12px;
        }

        .admin-item {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
        }

        .admin-item h3 {
            margin: 0 0 4px;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        /* Footer */

        .footer {
            margin-top: 55px;
            background: #171d2c;
            color: #c4cada;
            padding: 35px 0;
        }

        .footer-grid {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            flex-wrap: wrap;
        }

        .footer a {
            color: #fff;
            margin-right: 15px;
        }

        .footer-brand {
            font: 800 24px 'Manrope';
            color: #fff;
        }

        .footer-brand span {
            color: #a69eff;
        }

        .footer small {
            color: #9da7bb;
        }

        .two-col {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 18px;
        }

        .info-card {
            padding: 25px;
        }

        .info-card h3 {
            margin: 0 0 8px;
        }

        /* Toast message */

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #172033;
            color: white;
            padding: 13px 18px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
        }

        .toast.show {
            display: block;
        }

        /* Tablet screen */

        @media (max-width: 900px) {

            .nav-links {
                gap: 13px;
            }

            .hero {
                gap: 25px;
            }

            .cards {
                grid-template-columns: repeat(2,1fr);
            }

            .admin-layout {
                grid-template-columns: 1fr;
            }

            .detail-layout {
                grid-template-columns: 1fr 280px;
            }

        }

        /* Mobile screen */

        @media (max-width: 700px) {

            .nav {
                flex-wrap: wrap;
                padding: 13px 0;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                order: 3;
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 0;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-actions .btn-outline {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;
                padding: 48px 0 30px;
            }

            .hero-art {
                min-height: 260px;
                padding: 20px;
            }

            .hero h1 {
                font-size: 46px;
            }

            .stats,
            .cards,
            .dashboard-grid,
            .two-col {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .detail-layout {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 26px 20px;
            }

            .section-head {
                align-items: start;
                flex-direction: column;
            }

            .page-heading h1 {
                font-size: 32px;
            }

        }
    </style>
</head>

    <script>

        // Run this code after the page has loaded.
        document.addEventListener('DOMContentLoaded', function () {

            // Get the menu button and navigation links.
            let menuButton = document.getElementById('menuToggle');
            let navigationLinks = document.getElementById('navLinks');


            // Open or close the mobile menu.
            if (menuButton && navigationLinks) {

                menuButton.addEventListener('click', function () {

                    navigationLinks.classList.toggle('open');

                });

            }


            // Check whether a user is logged in.
            let currentUser = null;

            try {

                currentUser = JSON.parse(
                    localStorage.getItem('jobaddaCurrentUser') || 'null'
                );

            } catch (error) {

                currentUser = null;

            }


            // Get the login and register buttons.
            let loginButton = document.getElementById('navLogin');
            let registerButton = document.getElementById('navRegister');


            // Change the navigation buttons when a user is logged in.
            if (currentUser && loginButton && registerButton) {

                loginButton.textContent = 'Dashboard';
                loginButton.href = 'dashboard.html';

                registerButton.textContent = 'Log out';
                registerButton.href = '#';


                // Logout functionality.
                registerButton.addEventListener('click', function (event) {

                    event.preventDefault();

                    localStorage.removeItem('jobaddaCurrentUser');

                    location.href = 'index.html';

                });

            }


            // Highlight the current page in navigation.
            let navigationItems = document.querySelectorAll('.nav-links a');

            let currentPage = location.pathname.split('/').pop();

            for (let i = 0; i < navigationItems.length; i++) {

                let link = navigationItems[i];

                if (link.getAttribute('href') === currentPage) {

                    link.classList.add('active');

                }

            }


            // Display featured opportunities on the home page.
            let featuredSection = document.getElementById('homeFeatured');

            if (featuredSection) {

                let allItems = jobaddaGetItems();

                let featuredItems = allItems.slice(0, 3);

                let featuredHTML = '';

                for (let i = 0; i < featuredItems.length; i++) {

                    featuredHTML += jobaddaCard(featuredItems[i]);

                }

                featuredSection.innerHTML = featuredHTML;


                // Update the total number of jobs.
                let jobCount = document.getElementById('statJobs');

                if (jobCount) {

                    jobCount.textContent = allItems.length + '+';

                }

            }


            // Contact form functionality.
            let contactForm = document.getElementById('contactForm');

            if (contactForm) {

                contactForm.addEventListener('submit', function (event) {

                    event.preventDefault();

                    let message = document.getElementById('contactNotice');

                    message.textContent =
                        'Thanks! This demo form is working locally, but messages are not sent to an inbox.';

                    message.className = 'notice success show';

                    contactForm.reset();

                });

            }

        });


        // Get all jobs and internships.
        function jobaddaGetItems() {

            try {

                let savedItems = localStorage.getItem('jobaddaItems');

                if (savedItems) {

                    return JSON.parse(savedItems);

                }

                return window.JOBADDA_STARTER_ITEMS.slice();

            } catch (error) {

                return window.JOBADDA_STARTER_ITEMS.slice();

            }

        }

        window.jobaddaGetItems = jobaddaGetItems;


        // Save job data in localStorage.
        function jobaddaSaveItems(items) {

            localStorage.setItem('jobaddaItems', JSON.stringify(items));

        }

        window.jobaddaSaveItems = jobaddaSaveItems;


        // Get saved job IDs.
        function jobaddaGetSaved() {

            try {

                let savedJobs = localStorage.getItem('jobaddaSaved');

                if (savedJobs) {

                    return JSON.parse(savedJobs);

                }

                return [];

            } catch (error) {

                return [];

            }

        }

        window.jobaddaGetSaved = jobaddaGetSaved;


        // Save the saved job IDs.
        function jobaddaSaveSaved(items) {

            localStorage.setItem('jobaddaSaved', JSON.stringify(items));

        }

        window.jobaddaSaveSaved = jobaddaSaveSaved;


        // Make text safe before displaying it in HTML.
        function jobaddaEscape(value) {

            let text = String(value);

            text = text.replace(/&/g, '&amp;');
            text = text.replace(/</g, '&lt;');
            text = text.replace(/>/g, '&gt;');
            text = text.replace(/"/g, '&quot;');
            text = text.replace(/'/g, '&#39;');

            return text;

        }

        window.jobaddaEscape = jobaddaEscape;


        // Create a small notification message.
        function jobaddaToast(message) {

            let toast = document.getElementById('toast');

            if (toast) {

                toast.textContent = message;

                toast.classList.add('show');

                setTimeout(function () {

                    toast.classList.remove('show');

                }, 2400);

            }

        }

        window.jobaddaToast = jobaddaToast;


        // Create a job card.
        function jobaddaCard(item) {

            let savedJobs = jobaddaGetSaved();

            let isSaved = savedJobs.includes(Number(item.id));

            let saveText = '♡ Save';

            if (isSaved) {

                saveText = 'Saved ✓';

            }


            let companyName = item.company || 'J';

            let firstLetter = companyName.charAt(0).toUpperCase();


            let cardHTML = `
                <article class="job-card">

                    <div class="feature-top">

                        <div class="company-mark">
                            ${jobaddaEscape(firstLetter)}
                        </div>

                        <div>
                            <h3>${jobaddaEscape(item.title)}</h3>

                            <div class="company">
                                ${jobaddaEscape(item.company)}
                            </div>
                        </div>

                    </div>

                    <div class="job-meta">

                        <span>⌖ ${jobaddaEscape(item.location)}</span>

                        <span>◷ ${jobaddaEscape(item.mode)}</span>

                    </div>

                    <div>
                        ${(item.skills || []).slice(0, 3).map(function (skill) {
                            return `<span class="tag">${jobaddaEscape(skill)}</span>`;
                        }).join('')}
                    </div>

                    <div class="card-bottom">

                        <strong>
                            ${jobaddaEscape(item.salary || 'Pay not listed')}
                        </strong>

                        <div style="display:flex;gap:6px">

                            <button class="btn btn-soft" data-save="${item.id}">
                                ${saveText}
                            </button>

                            <a class="btn btn-primary"
                               href="job-details.html?id=${encodeURIComponent(item.id)}">
                                Details
                            </a>

                        </div>

                    </div>

                </article>
            `;

            return cardHTML;

        }

        window.jobaddaCard = jobaddaCard;


        // Handle Save button clicks on job cards.
        document.addEventListener('click', function (event) {

            let button = event.target.closest('[data-save]');

            if (!button) {

                return;

            }

            let jobId = Number(button.dataset.save);

            let savedJobs = jobaddaGetSaved();


            // Remove the job if it is already saved.
            if (savedJobs.includes(jobId)) {

                let updatedJobs = [];

                for (let i = 0; i < savedJobs.length; i++) {

                    if (savedJobs[i] !== jobId) {

                        updatedJobs.push(savedJobs[i]);

                    }

                }

                jobaddaSaveSaved(updatedJobs);

                button.textContent = '♡ Save';

                jobaddaToast('Removed from saved opportunities');

            } else {

                // Add the job to the saved list.
                savedJobs.push(jobId);

                jobaddaSaveSaved(savedJobs);

                button.textContent = 'Saved ✓';

                jobaddaToast('Opportunity saved');

            }

        });

    </script>


    <script>

        // Run this code after the page loads.
        document.addEventListener('DOMContentLoaded', function () {


            // Get the job ID from the URL.
            let urlParameters = new URLSearchParams(location.search);

            let jobId = Number(urlParameters.get('id'));


            // Get all available jobs and internships.
            let allItems = jobaddaGetItems();


            // Find the job that matches the URL ID.
            let selectedItem = null;

            for (let i = 0; i < allItems.length; i++) {

                if (Number(allItems[i].id) === jobId) {

                    selectedItem = allItems[i];

                    break;

                }

            }


            // Get the area where job details will appear.
            let detailsArea = document.getElementById('opportunityDetail');


            // Check whether the job exists.
            if (!selectedItem) {

                detailsArea.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">

                        <h3>Opportunity not found</h3>

                        <p class="muted">
                            This listing may have been removed.
                        </p>

                        <a class="btn btn-primary" href="jobs.html">
                            Browse jobs
                        </a>

                    </div>
                `;

                return;

            }


            // Check whether this opportunity is already saved.
            let savedJobs = jobaddaGetSaved();

            let isSaved = savedJobs.includes(jobId);

            let saveButtonText = '♡ Save opportunity';

            if (isSaved) {

                saveButtonText = 'Remove saved';

            }


            // Get the company first letter.
            let companyName = selectedItem.company || 'J';

            let firstLetter = companyName.charAt(0).toUpperCase();


            // Prepare the skills HTML.
            let skillsHTML = '';

            let skills = selectedItem.skills || [];

            for (let i = 0; i < skills.length; i++) {

                skillsHTML += `
                    <span class="tag">
                        ${jobaddaEscape(skills[i])}
                    </span>
                `;

            }


            // Display the complete job details.
            detailsArea.innerHTML = `

                <section class="panel">

                    <div class="detail-title">

                        <div class="company-mark">
                            ${jobaddaEscape(firstLetter)}
                        </div>

                        <div>

                            <div class="eyebrow">
                                ${jobaddaEscape(selectedItem.category)}
                            </div>

                            <h1>
                                ${jobaddaEscape(selectedItem.title)}
                            </h1>

                            <div class="muted">
                                ${jobaddaEscape(selectedItem.company)}
                            </div>

                        </div>

                    </div>


                    <div class="job-meta">

                        <span>
                            ⌖ ${jobaddaEscape(selectedItem.location)}
                        </span>

                        <span>
                            ◷ ${jobaddaEscape(selectedItem.mode)}
                        </span>

                        <span>
                            ${jobaddaEscape(selectedItem.type)}
                        </span>

                    </div>


                    <h2>About this opportunity</h2>

                    <p class="description-text">
                        ${jobaddaEscape(selectedItem.description)}
                    </p>


                    <h2 style="margin-top:25px">
                        Skills
                    </h2>

                    ${skillsHTML}

                </section>


                <aside class="panel">

                    <div class="eyebrow">
                        COMPENSATION
                    </div>

                    <h2>
                        ${jobaddaEscape(selectedItem.salary || 'Not specified')}
                    </h2>

                    <p class="muted">
                        Listed by ${jobaddaEscape(selectedItem.company)}
                    </p>


                    <button
                        class="btn btn-primary btn-block"
                        id="applyDemo"
                    >
                        Apply interest
                    </button>


                    <button
                        class="btn btn-outline btn-block"
                        id="saveDetail"
                        style="margin-top:9px"
                    >
                        ${saveButtonText}
                    </button>


                    <p class="muted" style="font-size:12px;margin-top:14px">
                        Demo only: applying records your interest locally;
                        no application is sent to an employer.
                    </p>


                    <div id="detailNotice" class="notice"></div>

                </aside>

            `;


            let saveDetailButton = document.getElementById('saveDetail');

            saveDetailButton.addEventListener('click', function () {

                let savedList = jobaddaGetSaved();

                // Check whether the opportunity is saved.
                if (savedList.includes(jobId)) {

                    // Remove the opportunity.
                    let updatedList = [];

                    for (let i = 0; i < savedList.length; i++) {

                        if (savedList[i] !== jobId) {

                            updatedList.push(savedList[i]);

                        }

                    }

                    savedList = updatedList;

                    jobaddaToast('Removed from saved');

                } else {

                    // Add the opportunity.
                    savedList.push(jobId);

                    jobaddaToast('Opportunity saved');

                }


                // Save the updated list.
                jobaddaSaveSaved(savedList);


                // Update the button text.
                if (savedList.includes(jobId)) {

                    saveDetailButton.textContent = 'Remove saved';

                } else {

                    saveDetailButton.textContent = '♡ Save opportunity';

                }

            });


            let applyButton = document.getElementById('applyDemo');

            applyButton.addEventListener('click', function () {

                // Check whether the user is logged in.
                let currentUser = null;

                try {

                    currentUser = JSON.parse(
                        localStorage.getItem('jobaddaCurrentUser') || 'null'
                    );

                } catch (error) {

                    currentUser = null;

                }


                // Get the message area.
                let notice = document.getElementById('detailNotice');


                // Show the correct message.
                if (currentUser) {

                    notice.textContent =
                        'Your interest has been recorded in this browser demo.';

                    notice.className = 'notice success show';

                } else {

                    notice.textContent =
                        'Please log in or create an account before expressing interest.';

                    notice.className = 'notice success show';


                    // Redirect the user to login page.
                    setTimeout(function () {

                        location.href = 'login.html';

                    }, 1300);

                }

            });

        });

    </script>

</body>
</html>
