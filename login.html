<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Bridge</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">
        <div class="container">

            <a href="index.html" class="logo">
                Bridge<span>.</span>
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Jobs</a></li>
                    <li><a href="internships.html">Internships</a></li>
                    <li><a href="about.html">For Employers</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <a href="register.html" class="btn btn-primary btn-sm">
                    Get started
                </a>
            </div>

            <button class="nav-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>


    <main>

        <div class="auth-wrap">

            <div class="auth-card">

                <h1>Welcome back</h1>

                <p class="sub">
                    Log in to track applications and see new matches.
                </p>


                <!-- Student / Employer selection -->

                <div class="role-toggle">

                    <label>
                        <input type="radio" name="role" checked>
                        <span>Student</span>
                    </label>

                    <label>
                        <input type="radio" name="role">
                        <span>Employer</span>
                    </label>

                </div>


                <!-- Login form -->

                <form action="dashboard.html">

                    <div class="field">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="you@example.com">

                    </div>


                    <div class="field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            required
                            placeholder="••••••••">

                    </div>


                    <button type="submit" class="btn btn-primary btn-block">
                        Log in
                    </button>

                </form>

            </div>

        </div>

    </main>


</body>
</html>
