
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobAdda</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7fb;
            color: #192238;
        }

        a {
            text-decoration: none;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e1e5ee;
            padding: 14px 0;
        }

        .nav-container {
            max-width: 1230px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #192238;
        }

        .logo span {
            color: #5b4cf5;
        }

        .nav-button {
            background: #f0efff;
            color: #5b4cf5;
            padding: 14px 17px;
            border-radius: 12px;
            font-weight: bold;
        }

        .nav-button:hover {
            background: #e5e1ff;
        }

        .container {
            max-width: 1230px;
            margin: auto;
            padding: 65px 20px;
        }

        .login-section {
            max-width: 538px;
            margin: auto;
        }

        .subtitle {
            color: #5b4cf5;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 13px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .description {
            color: #6b788e;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-card {
            background: white;
            border: 1px solid #e0e5ef;
            border-radius: 19px;
            padding: 23px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 16px 13px;
            border: 1px solid #dfe4ee;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #5b4cf5;
        }

        .primary-button {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #5b4cf5;
            color: white;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #4939e5;
        }

        .demo-text {
            color: #697790;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 15px;
        }

        .extra-links {
            margin-top: 22px;
            text-align: center;
            color: #697790;
            font-size: 14px;
            line-height: 2;
        }

        .extra-links a {
            color: #5b4cf5;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #697790;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 23px;
            }

            .container {
                padding: 45px 18px;
            }

            h1 {
                font-size: 34px;
            }

            .description {
                font-size: 15px;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="navbar">
        <div class="nav-container">
            <a href="saved.html" class="logo">
                Job<span>Adda</span>
            </a>

            <a href="register.html" class="nav-button">
                Create account
            </a>
        </div>
    </header>

    <!-- Login section -->
    <main class="container">
        <section class="login-section">

            <p class="subtitle">STUDENT ACCOUNT</p>

            <h1>Welcome back</h1>

            <p class="description">
                Login to see your saved opportunities and applications.
            </p>

            <div class="form-card">
                <form action="saved.html" method="get">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="student@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            minlength="4"
                            required
                        >
                    </div>

                    <button type="submit" class="primary-button">
                        Login
                    </button>

                    <p class="demo-text">
                        Student career portal demo.
                    </p>
                </form>
            </div>

            <div class="extra-links">
                Don't have an account?
                <a href="register.html">Register here</a>
                <br>
                Want to browse saved opportunities?
                <a href="saved.html">Open Saved Jobs</a>
            </div>

        </section>
    </main>

    <footer>
        © 2026 JobAdda - Student Career Portal
    </footer>

</body>
</html>
